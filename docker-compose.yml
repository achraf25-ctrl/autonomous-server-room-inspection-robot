version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: inspection_bot_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  dashboard:
    build: ./src/inspection_bot_dashboard
    container_name: inspection_bot_dashboard
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER_HOST=mosquitto
    ports:
      - "5000:5000"
